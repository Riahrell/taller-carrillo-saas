# Reviewed TLS overlay; do not use until provider/keys/restore acceptance passes.
services:
  backend:
    image: ${BACKEND_IMAGE:?Configure the validated backend release image}
    environment:
      APP_ENV: production
    restart: unless-stopped
  migrate:
    environment:
      IDENTITY_KEYS_FILE: /run/secrets/identity_keys
    secrets: [identity_keys]
  image-worker:
    environment:
      IDENTITY_KEYS_FILE: /run/secrets/identity_keys
    secrets: [identity_keys]
  frontend:
    image: ${FRONTEND_IMAGE:?Configure the validated frontend release image}
    restart: unless-stopped
  proxy:
    volumes:
      - ${ACME_WEBROOT_DIR:?Configure the certificate renewal webroot}:/var/lib/acme:ro
    image: ${PROXY_IMAGE:?Configure the validated proxy release image}
    ports:
      - "80:8080"
      - "443:8443"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
    secrets:
      - tls_certificate
      - tls_private_key
  db:
    image: ${POSTGRES_IMAGE:?Configure the validated database release image}
    restart: unless-stopped
configs:
  proxy_config:
    file: ${TLS_PROXY_CONFIG_FILE:?Render and review the TLS proxy configuration}
secrets:
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE:?Configure a valid full certificate chain}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_FILE:?Configure the private TLS key file}
