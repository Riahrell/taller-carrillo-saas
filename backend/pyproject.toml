[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "taller-carrillo-backend"
version = "0.1.0"
description = "Backend modular para la gestión de Taller Carrillo"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "pip-tools>=7.6,<8",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers --tb=short"
filterwarnings = ["error"]
markers = ["integration: requires an isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
