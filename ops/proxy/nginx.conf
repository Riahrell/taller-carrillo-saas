worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    limit_req_zone $binary_remote_addr zone=access_requests:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=access_connections:10m;

    server {
        listen 8080;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Connection "";

        location = /api {
            return 308 /api/;
        }

        location /api/ {
            client_max_body_size 8k;
            error_page 413 @api_too_large;
            proxy_pass http://backend:8000/;
        }

        location /api/auth/ {
            # Nginx request error messages can include raw queries/headers.
            # Keep safe status access logs; do not log request errors for access.
            error_log /dev/null;
            proxy_hide_header Cache-Control;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
            client_max_body_size 8k;
            client_body_timeout 10s;
            proxy_request_buffering on;
            limit_req zone=access_requests burst=20 nodelay;
            limit_req_status 429;
            limit_conn access_connections 10;
            limit_conn_status 429;
            error_page 413 @api_too_large;
            error_page 429 @access_limited;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @access_unavailable;
            proxy_pass http://backend:8000/auth/;
        }

        location /api/catalog/ {
            error_log /dev/null;
            proxy_hide_header Cache-Control;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
            client_max_body_size 8k;
            client_body_timeout 10s;
            proxy_request_buffering on;
            limit_req zone=access_requests burst=20 nodelay;
            limit_req_status 429;
            limit_conn access_connections 10;
            limit_conn_status 429;
            error_page 413 @api_too_large;
            error_page 429 @access_limited;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @catalog_unavailable;
            proxy_pass http://backend:8000/catalog/;
        }

        location @catalog_unavailable {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
            return 503 '{"detail":"Catalog unavailable"}';
        }

        location @access_unavailable {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
            return 503 '{"detail":"Authentication unavailable"}';
        }

        location @access_limited {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
            return 429 '{"detail":"Request rejected"}';
        }

        location @api_too_large {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
            return 413 '{"detail":"Request rejected"}';
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_buffering off;
        }
    }
}
